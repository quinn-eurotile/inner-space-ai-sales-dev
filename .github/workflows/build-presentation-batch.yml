name: Build presentation batch
on:
  push:
    branches:
      - presentation-batch-20260921
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRESENTATION_CLIENT_IDS: '01,02,03,04,05,06,07,08,09,10,11,12,13'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install reportlab pillow requests fonttools pymupdf pytest
      - name: Prepare fonts
        run: |
          mkdir -p /tmp/isfonts
          curl -L --fail --retry 3 -o /tmp/Inter-var.ttf 'https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/Playfair-var.ttf 'https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf'
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          specs=[
            ('/tmp/Inter-var.ttf','/tmp/isfonts/Inter-Regular.ttf',{'wght':400,'opsz':14}),
            ('/tmp/Inter-var.ttf','/tmp/isfonts/Inter-Medium.ttf',{'wght':500,'opsz':14}),
            ('/tmp/Inter-var.ttf','/tmp/isfonts/Inter-Bold.ttf',{'wght':700,'opsz':14}),
            ('/tmp/Playfair-var.ttf','/tmp/isfonts/PlayfairDisplay-Regular.ttf',{'wght':400}),
          ]
          for src,dst,axes in specs:
            f=TTFont(src); instantiateVariableFont(f,axes,inplace=False).save(dst)
          PY
      - name: Source-truth and builder tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import presentation_builder, presentation_jobs; print('repository-local package imports: PASS')"
          pytest -q
      - name: Download known-good baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: inner-space-presentation-batch-20260921
          path: baseline_output
          github-token: ${{ github.token }}
          run-id: 35657545269
      - name: Generate approved production PDFs CLIENT-01 through CLIENT-13
        run: python batch_presentations.py
      - name: PDF preflight and render visual QA
        run: |
          mkdir -p presentation_output/qa/baseline
          for id in 01 02 03 04 05 06 07 08 09 10 11 12 13; do cp baseline_output/CLIENT-${id}-*-Material-Selection.pdf presentation_output/qa/baseline/; done
          for f in presentation_output/*.pdf; do
            pdfinfo "$f" > "presentation_output/qa/$(basename "$f" .pdf)-pdfinfo.txt"
            pdftotext "$f" "presentation_output/qa/$(basename "$f" .pdf)-text.txt"
          done
          python render_presentation_qa.py
      - name: Verify exactly thirteen production PDFs
        run: |
          count=$(find presentation_output -maxdepth 1 -name 'CLIENT-*.pdf' | wc -l)
          test "$count" -eq 13
          for id in 01 02 03 04 05 06 07 08 09 10 11 12 13; do test $(find presentation_output -maxdepth 1 -name "CLIENT-${id}-*.pdf" | wc -l) -eq 1; done
      - name: Fail if any layout QA failed
        run: |
          python - <<'PY'
          import glob,json,sys
          bad=[]
          for f in glob.glob('presentation_output/qa/CLIENT-*-layout-qa.json'):
              q=json.load(open(f))
              if not q.get('ok'): bad.append((f,q.get('errors',[])))
          if bad:
              print(bad); sys.exit(1)
          print('All layout QA manifests PASS')
          PY
      - name: Deliver QA-passed presentations to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python deliver_presentations.py
      - uses: actions/upload-artifact@v4
        with:
          name: inner-space-presentation-builder-production-01-13
          path: presentation_output/
          retention-days: 14
