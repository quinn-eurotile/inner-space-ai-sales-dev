name: Build presentation batch
on:
  push:
    branches:
      - presentation-batch-20260921
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRESENTATION_CLIENT_IDS: '09,10,11'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install reportlab pillow requests fonttools pymupdf pytest
      - name: Prepare fonts
        run: |
          mkdir -p /tmp/isfonts
          curl -L --fail --retry 3 -o /tmp/Inter-var.ttf 'https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/Playfair-var.ttf 'https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf'
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          specs=[
            ('/tmp/Inter-var.ttf','/tmp/isfonts/Inter-Regular.ttf',{'wght':400,'opsz':14}),
            ('/tmp/Inter-var.ttf','/tmp/isfonts/Inter-Medium.ttf',{'wght':500,'opsz':14}),
            ('/tmp/Inter-var.ttf','/tmp/isfonts/Inter-Bold.ttf',{'wght':700,'opsz':14}),
            ('/tmp/Playfair-var.ttf','/tmp/isfonts/PlayfairDisplay-Regular.ttf',{'wght':400}),
          ]
          for src,dst,axes in specs:
            f=TTFont(src); instantiateVariableFont(f,axes,inplace=False).save(dst)
          PY
      - name: Source-truth and builder tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import presentation_builder, presentation_jobs; print('repository-local package imports: PASS')"
          pytest -q
      - name: Resolve San Andreas Cotto from live Inner Space catalogue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, requests
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          h={'apikey':key,'Authorization':'Bearer '+key}
          def get(table,params):
              r=requests.get(f"{base}/rest/v1/{table}",headers=h,params=params,timeout=60)
              r.raise_for_status()
              return r.json()
          products=get('products_core',{
              'select':'id,product_name,slug,description,long_description,shade,shade_variation,tile_colour,finish,tile_style,shape,edge,slip_rating,no_tile_faces,material,frost_resistant,underfloor_heating_compatible,matching_outdoor_option,origin,product_category,page_type,suitability,collection_id',
              'slug':'eq.san-andreas-cotto-ambra'
          })
          if len(products)!=1:
              raise SystemExit(f"Expected one San Andreas Cotto product, got {len(products)}")
          p=products[0]
          variants=get('product_variants',{
              'select':'id,variant_label,product_code,sku,sku_role,is_default,display_order,nominal_size,thickness_mm,width_mm,length_mm,data_sheet_url',
              'product_id':f"eq.{p['id']}",
              'order':'display_order.asc'
          })
          images=get('product_images',{
              'select':'id,image_type,image_url,display_order,variant_id',
              'product_id':f"eq.{p['id']}",
              'order':'display_order.asc'
          })
          collection=get('collections',{
              'select':'id,name,slug,description,lifestyle_url,technical_spec_pdf_url,technical_spec_file_name',
              'id':f"eq.{p['collection_id']}"
          })
          out={'product':p,'variants':variants,'images':images,'collection':collection[0] if collection else None,'website_url':'https://innerspace.co.uk/showroom/p/san-andreas-cotto-ambra'}
          print('SAN_ANDREAS_RESOLUTION_START')
          print(json.dumps(out,indent=2))
          print('SAN_ANDREAS_RESOLUTION_END')
          spec=(out.get('collection') or {}).get('technical_spec_pdf_url')
          if not spec:
              raise SystemExit('San Andreas technical specification PDF URL missing')
          pdf=requests.get(spec,timeout=60)
          pdf.raise_for_status()
          open('/tmp/san-andreas.pdf','wb').write(pdf.content)
          print('SAN_ANDREAS_SPEC_DOWNLOADED',len(pdf.content))
          PY
          pdftotext -layout /tmp/san-andreas.pdf /tmp/san-andreas.txt
          echo SAN_ANDREAS_SPEC_TEXT_START
          cat /tmp/san-andreas.txt
          echo SAN_ANDREAS_SPEC_TEXT_END
          exit 1
      - name: Download known-good baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: inner-space-presentation-batch-20260921
          path: baseline_output
          github-token: ${{ github.token }}
          run-id: 35657545269
      - name: Generate approved production PDFs CLIENT-01 through CLIENT-13
        run: python batch_presentations.py
      - name: PDF preflight and render visual QA
        run: |
          mkdir -p presentation_output/qa/baseline
          for id in 01 02 03 04 05 06 07 08 09 10 11 12 13; do cp baseline_output/CLIENT-${id}-*-Material-Selection.pdf presentation_output/qa/baseline/; done
          for f in presentation_output/*.pdf; do
            pdfinfo "$f" > "presentation_output/qa/$(basename "$f" .pdf)-pdfinfo.txt"
            pdftotext "$f" "presentation_output/qa/$(basename "$f" .pdf)-text.txt"
          done
          python render_presentation_qa.py
      - name: Verify exactly thirteen production PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from presentation_builder.builder import client_pdf_filename
          from presentation_jobs.batch_20260921 import CLIENTS

          selected={x.strip().zfill(2) for x in __import__('os').environ['PRESENTATION_CLIENT_IDS'].split(',') if x.strip()}
          jobs=[c for c in CLIENTS if str(c['id']).zfill(2) in selected]
          expected={client_pdf_filename(c) for c in jobs}
          actual={p.name for p in Path('presentation_output').glob('*.pdf')}
          if actual != expected:
              raise SystemExit(f'PDF filename guard failed. expected={sorted(expected)!r} actual={sorted(actual)!r}')
          print('Client-facing PDF filename guard PASS')
          PY
      - name: Fail if any layout QA failed
        run: |
          python - <<'PY'
          import glob,json,sys
          bad=[]
          for f in glob.glob('presentation_output/qa/CLIENT-*-layout-qa.json'):
              q=json.load(open(f))
              if not q.get('ok'): bad.append((f,q.get('errors',[])))
          if bad:
              print(bad); sys.exit(1)
          print('All layout QA manifests PASS')
          PY
      - name: Deliver QA-passed presentations to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python deliver_presentations.py
      - uses: actions/upload-artifact@v4
        with:
          name: inner-space-presentation-builder-production-01-13
          path: presentation_output/
          retention-days: 14
